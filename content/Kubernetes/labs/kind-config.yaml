# Cluster configuration for the Kubernetes labs.
# Reference profile: kind v0.33.0 with kindest/node:v1.37.0 (pass the image on
# the command line; see labs/ckad/01-cluster-setup.md for the pinned digest).
# kind v0.31 and older cannot start a v1.37 node.
# Architecture: 1 control plane + 2 workers. Host ports 80, 443, 30080 and
# 30443 are published on the control-plane node, so a NodePort of 30080 or
# 30443 is reachable on localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-lab
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: "zone-a"
  - role: worker
    labels:
      topology.kubernetes.io/zone: "zone-b"
