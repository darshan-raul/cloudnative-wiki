# Canonical Kind cluster configuration for Kubernetes Curriculum Labs
# Tested with Kubernetes v1.35 - v1.37 / kind v0.27+
# Architecture: 1 Control-Plane + 2 Worker Nodes
# Includes extraPortMappings for ports 80 and 443 on the ingress-ready node
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: "zone-a"
  - role: worker
    labels:
      topology.kubernetes.io/zone: "zone-b"
